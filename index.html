const counts={};QUESTIONS.forEach(q=>counts[q.c]=(counts[q.c]||0)+1);const expected={6:9,7:16,8:10,9:18,10:23,11:5,12:9};
let i=0,score=0,answers=[],locked=false;const $=id=>document.getElementById(id);
function render(){const q=QUESTIONS[i];locked=false;$('chapterPill').textContent='Chapter '+q.c;$('progress').textContent=`ข้อ ${i+1} / ${QUESTIONS.length}`;$('fill').style.width=((i)/QUESTIONS.length*100)+'%';$('score').textContent='คะแนน '+score;$('question').textContent=q.q;$('feedback').className='feedback';$('feedback').innerHTML='';$('next').classList.add('hidden');$('choices').innerHTML='';q.a.forEach((t,j)=>{const b=document.createElement('button');b.className='choice';b.textContent=`${String.fromCharCode(65+j)}. ${t}`;b.onclick=()=>answer(j,b);$('choices').appendChild(b)});}
function answer(j,btn){if(locked)return;locked=true;const q=QUESTIONS[i],buttons=[...document.querySelectorAll('.choice')];buttons.forEach(b=>b.disabled=true);buttons[q.x].classList.add('correct');if(j===q.x){score++;$('feedback').className='feedback good show';$('feedback').innerHTML='<b>✓ ถูกต้อง!</b><div class="explain">'+q.e+'</div>'}else{btn.classList.add('wrong');$('feedback').className='feedback bad show';$('feedback').innerHTML='<b>✗ ยังไม่ถูก</b><div class="explain">คำตอบที่ถูก: <b>'+String.fromCharCode(65+q.x)+'. '+q.a[q.x]+'</b><br>'+q.e+'</div>'}answers[i]=j;$('score').textContent='คะแนน '+score;$('next').textContent=i===QUESTIONS.length-1?'ดูผลคะแนน →':'ข้อถัดไป →';$('next').classList.remove('hidden');}
$('next').onclick=()=>{if(i<QUESTIONS.length-1){i++;render()}else showResult()};
function showResult(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('finalScore').textContent=`ได้ ${score} / ${QUESTIONS.length} คะแนน (${Math.round(score/QUESTIONS.length*100)}%)`;$('fill').style.width='100%';let html='';Object.keys(expected).forEach(c=>{let total=0,correct=0;QUESTIONS.forEach((q,k)=>{if(q.c==c){total++;if(answers[k]===q.x)correct++}});html+=`<div class="stat"><span>Chapter ${c}</span><b>${correct} / ${total}</b></div>`});$('chapterScores').innerHTML=html;let wrong='';QUESTIONS.forEach((q,k)=>{if(answers[k]!==q.x){wrong+=`<div class="wrong-item"><b>ข้อ ${k+1} — Chapter ${q.c}</b><div>${q.q}</div><div class="small">คำตอบที่ถูก: ${String.fromCharCode(65+q.x)}. ${q.a[q.x]}</div></div>`}});$('wrongList').innerHTML=wrong||'<p>ไม่มีข้อผิดเลย เก่งมาก! 🎉</p>';}
$('restart').onclick=()=>{i=0;score=0;answers=[];$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};render();
</script></body></html>
